services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bea_logistics
      POSTGRES_USER: bea
      POSTGRES_PASSWORD: bea_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bea -d bea_logistics"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://bea:bea_dev_password@db:5432/bea_logistics
      JWT_SECRET: local-compose-secret-change-before-deployment
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
